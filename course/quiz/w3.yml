source: course/notion/w3/w3-research-methodology.md
provenance: Original formative checkpoint explanations; no graded assignment.
items:
- question: Why does closing a research issue not establish a scientific claim?
  answer: It records workflow completion against task criteria. Scientific support
    still requires appropriate data, comparisons, analysis and review of limitations.
- question: What should you check when a document is missing from a project view?
  answer: Check the original and authorized access, project metadata, connector scope
    and collection status. Missing visibility does not prove that work never occurred.
- question: Why compare methods using matched run identifiers?
  answer: Matching controls the evaluation conditions. Independent sorting breaks
    that correspondence and can hide the distribution of within-run differences.
- question: What does a metadata audit fail to prove?
  answer: Nonempty fields do not verify their truth, source accessibility, absence
    of leakage, scientific validity, novelty or generalization.
- question: When is an AI assistant right to withhold a research-readiness judgment?
  answer: When the supplied or accessible records do not support it. It should identify
    the missing evidence rather than infer readiness from references or fluent summaries.
- question: How will this workflow support the Week 4 variational-inference experiment?
  answer: Record the model, inference method, exact reference, settings and diagnostics;
    separate convergence from approximation quality and qualify the supported claim.
