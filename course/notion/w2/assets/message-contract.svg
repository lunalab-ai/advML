<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" fill="#f6f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif" fill="#172554"><text x="35" y="45" font-size="26" font-weight="bold">A message keeps the receiver state</text><rect x="35" y="76" width="350" height="215" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="55" y="111" font-size="22" font-weight="bold">Inputs</text><text x="55" y="153" font-size="19">Rows of T_bc: B states</text><text x="55" y="184" font-size="19">Columns of T_bc: C states</text><text x="55" y="215" font-size="19">T_bc = [[.8,.2],[.1,.9]]</text><text x="55" y="246" font-size="19">Evidence at C = [.3,.7]</text><text x="394" y="190" font-size="30">→</text><rect x="425" y="76" width="350" height="215" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="445" y="111" font-size="22" font-weight="bold">Sum out C</text><text x="445" y="153" font-size="19">B=0: .8×.3 + .2×.7</text><text x="445" y="184" font-size="19">.24 + .14 = .38</text><text x="445" y="215" font-size="19">B=1: .1×.3 + .9×.7</text><text x="445" y="246" font-size="19">.03 + .63 = .66</text><text x="784" y="190" font-size="30">→</text><rect x="815" y="76" width="350" height="215" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="835" y="111" font-size="22" font-weight="bold">Output indexed by B</text><text x="835" y="153" font-size="19">message C → B = [.38,.66]</text><text x="835" y="184" font-size="19">One value for each B state</text><text x="835" y="215" font-size="19">Message is not a posterior</text><text x="835" y="246" font-size="19">Combine, then normalize</text><text x="35" y="333" font-size="18">Original worked diagram · table orientation determines which index is summed out.</text></g></svg>