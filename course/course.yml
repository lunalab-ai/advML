  - W2 includes a 10-point project. Use the separate SmartClass assignment entry for
    the deadline and submission.
  notion_url: https://app.notion.com/p/W2-Graphical-Models-Conditional-Independence-and-Message-Passing-3d47fd00109f819bb2baf8f5b875cc16?source=copy_link
