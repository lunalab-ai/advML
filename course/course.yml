    notice_summary: Investigate when converged message passing gives inaccurate posterior
      marginals. Design your own tree/cycle/frustration experiments; derive and implement
      exact cycle inference by conditioning a node; then propose a theory-based extension
      and test it on unused seeds and an unseen regime. The project includes numerical
      invariance tests, an ablation and a 60-node scalability demonstration. Read
      the full specification before beginning.
    submission_instructions: 'Submit one ZIP through the SmartClass assignment entry:
      report.pdf, executed project.ipynb, your implementation and README, complete
      results table, tests, and assistance.md. The supplied starter is intentionally
      unfinished. A well-supported negative result can receive full credit. Existing
      course integrity and late-submission policies apply.'
